[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docker-exposure-doctor"
version = "0.1.0"
description = "Read-only offline Compose exposure checks with value-free findings"
requires-python = ">=3.10"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
docker-exposure-doctor = "docker_exposure_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
